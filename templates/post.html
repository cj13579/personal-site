<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="date" content='$date-meta$'>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>cjblake.net | $title$</title>
    <style>
        .footer {
            position:relative;
            left: 0;
            bottom: 0;
            width: 100%;
            text-align: center;
        }
        .post-navigation {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 2rem;
        }
        .post-navigation a {
            max-width: 45%;
        }
        .post-navigation .next {
            margin-left: auto;
            text-align: right;
        }
    </style>
    <script defer src="https://umami.cjblake.net/script.js" data-website-id="fa958aa1-6a54-4263-a536-a6f44d86a6e6"></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <!-- <a class="navbar-brand" href="#">Navbar</a> -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/cv.html">CV</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/projects.html">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/blog.html">Blog</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="text-center">
            <h1>$title$</h1>
            <p>
                Posted on <b>$post-date$</b> by <b>$author$</b>
            </p>
        </div>
        $body$
        $if(previous-post-url)$
        <hr />
        <nav class="post-navigation" aria-label="Post navigation">
            <a class="previous" rel="prev" href="$previous-post-url$">Previous: $previous-post-title$</a>
            $if(next-post-url)$
            <a class="next" rel="next" href="$next-post-url$">Next: $next-post-title$</a>
            $endif$
        </nav>
        $elseif(next-post-url)$
        <hr />
        <nav class="post-navigation" aria-label="Post navigation">
            <a class="next" rel="next" href="$next-post-url$">Next: $next-post-title$</a>
        </nav>
        $endif$
    </div>
    <footer class="footer mt-auto py-3 bg-light">
        <div class="container">
            <span class="text-muted">&copy; 2026 Christopher Blake.</span>
        </div>
    </footer>
  </body>
</html>
