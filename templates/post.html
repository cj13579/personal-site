<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="date" content='$date-meta$'>
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico">
    <title>cjblake.net | $title$</title>
    <style>
        .footer {
            position:relative;
            left: 0;
            bottom: 0;
            width: 100%;
            text-align: center;
        }
        .post-navigation {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 2rem;
        }
        .post-navigation a {
            max-width: 45%;
        }
        .post-navigation .next {
            margin-left: auto;
            text-align: right;
        }
    </style>
    <script defer src="https://umami.cjblake.net/script.js" data-website-id="fa958aa1-6a54-4263-a536-a6f44d86a6e6"></script>
  </head>
  <body>
    <div align="center">
        <a href="/">Home</a> |
        <a href="/cv.html">CV</a> |
        <a href="/projects.html">Projects</a> |
        <a href="/blog.html">Blog</a>
    </div>
    <div>
        <div align="center">
            <h1>$title$</h1>
            <p>
                Posted on <b>$post-date$</b> by <b>$author$</b>
            </p>
        </div>
        $body$
        $if(previous-post-url)$
        <hr />
        <nav class="post-navigation" aria-label="Post navigation">
            <a class="previous" rel="prev" href="$previous-post-url$">Previous: $previous-post-title$</a>
            $if(next-post-url)$
            <a class="next" rel="next" href="$next-post-url$">Next: $next-post-title$</a>
            $endif$
        </nav>
        $elseif(next-post-url)$
        <hr />
        <nav class="post-navigation" aria-label="Post navigation">
            <a class="next" rel="next" href="$next-post-url$">Next: $next-post-title$</a>
        </nav>
        $endif$
    </div>
    <div>
        <footer class="footer">
            &copy; 2026 Christopher Blake.
        </footer>
    </div>
  </body>
</html>
